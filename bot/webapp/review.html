<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SpeakOut · Повторение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:      var(--tg-theme-bg-color, #ffffff);
    --fg:      var(--tg-theme-text-color, #1a1a1a);
    --muted:   var(--tg-theme-hint-color, #8a8a8e);
    --card:    var(--tg-theme-secondary-bg-color, #f2f2f7);
    --link:    var(--tg-theme-link-color, #2f6fed);
    --know:    #2f9e57;
    --dont:    #e5484d;
    --know-bg: rgba(47, 158, 87, .12);
    --dont-bg: rgba(229, 72, 77, .12);
  }
  :root[data-theme="dark"] { --know: #4cc47c; --dont: #ff6369;
            --know-bg: rgba(76,196,124,.18); --dont-bg: rgba(255,99,105,.18); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font: 400 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 34rem; margin: 0 auto;
    -webkit-user-select: none; user-select: none;
  }

  header { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  #left { font-variant-numeric: tabular-nums; }
  #bar { flex: 1; height: 3px; border-radius: 2px; background: var(--card); overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--link); transition: width .3s ease; }

  /* The card fills what is left, so the word sits in the optical middle of the
     screen however tall the phone is. */
  main { flex: 1; display: flex; flex-direction: column; align-items: center;
         justify-content: center; text-align: center; gap: 14px; padding: 24px 0; }

  #word { font-size: 40px; font-weight: 600; line-height: 1.15; word-break: break-word; }
  #pos  { font-size: 14px; color: var(--muted); }

  /* Hidden until they answer. Seeing the translation before deciding is not a
     review, it is reading — and it quietly destroys the schedule. */
  #answer { font-size: 26px; color: var(--dont); opacity: 0; transform: translateY(6px);
            transition: opacity .2s, transform .2s; min-height: 34px; }
  #answer.show { opacity: 1; transform: none; }

  /* The picture comes in under the translation, and only once it has loaded —
     a box that pops open empty and fills in later moves the word off the
     middle of the screen at the exact moment they are reading it. */
  #shot { max-width: 100%; max-height: 34vh; border-radius: 14px; display: none;
          margin: 4px auto 0; object-fit: cover; }
  #shot.show { display: block; animation: rise .22s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  #buttons { display: flex; gap: 12px; }
  button {
    flex: 1; font: inherit; font-size: 17px; font-weight: 600;
    padding: 18px 12px; border: 0; border-radius: 16px; color: var(--fg);
    background: var(--card); cursor: pointer; transition: transform .1s, filter .15s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; }
  #no  { background: var(--dont-bg); color: var(--dont); }
  #yes { background: var(--know-bg); color: var(--know); }
  /* Filled rather than tinted: once the answer is up, "не знал" is a choice
     that has been made, and it has to look different from one still on offer. */
  #no.chosen { background: var(--dont); color: #fff; }

  /* What pressing the green button will actually do. Without it, changing your
     mind after seeing the answer is a decision taken in the dark. */
  #verdict { text-align: center; font-size: 13px; color: var(--muted);
             min-height: 18px; padding: 10px 0 2px; }

  footer { text-align: center; font-size: 13px; color: var(--muted); padding-top: 14px; }
  #reset { color: var(--link); cursor: pointer; }

  #done { display: none; text-align: center; }
  #done h2 { font-size: 22px; margin: 0 0 8px; }
  #done p  { color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body>

<header>
  <span id="left"></span>
  <span id="bar"><span id="fill"></span></span>
</header>

<main>
  <div id="live">
    <div id="word">…</div>
    <div id="pos"></div>
    <div id="answer"></div>
    <img id="shot" alt="">
  </div>
  <div id="done">
    <h2 id="done-title">Готово 👌</h2>
    <p id="done-text"></p>
  </div>
</main>

<div id="verdict"></div>

<div id="buttons">
  <button id="no">Не знаю</button>
  <button id="yes">Знаю</button>
</div>

<footer>
  <span id="archive"></span>
</footer>

<script>

/* One source of truth for light and dark: Telegram's, not the operating
   system's. They disagree more often than you would think — a dark Telegram
   on a light phone is common — and taking the surfaces from one and the data
   colours from the other paints dark squares on a white card. */
function applyTheme() {
  const scheme = window.Telegram?.WebApp?.colorScheme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = scheme;
}
applyTheme();
window.Telegram?.WebApp?.onEvent?.("themeChanged", applyTheme);
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const initData = tg?.initData || "";

// Opened from the home screen, the way back is Telegram's own arrow in the
// header — a second, in-page back button would be one control too many.
if (new URLSearchParams(location.search).get("from") === "home" && tg?.BackButton) {
  tg.BackButton.show();
  tg.BackButton.onClick(() => { location.href = "/home"; });
}
const $ = (id) => document.getElementById(id);
const buzz = (s) => { try { tg?.HapticFeedback?.impactOccurred(s); } catch (_) {} };

let queue = [];
let index = 0;
let total = 0;
let archived = 0;

/* Two pieces of state, and the whole interaction turns on keeping them apart.
   `revealed` is whether the answer is on screen; `verdict` is what will be
   recorded when they move on. The first press sets a verdict AND reveals; the
   answer is then visible while the verdict is still changeable, which is the
   point — you cannot honestly grade a recall you have not checked, and people
   overestimate themselves when nothing contradicts them. */
let revealed = false;
let verdict = null;      // true = knew it, false = did not

function api(path, options = {}) {
  return fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": initData,
      ...(options.headers || {}),
    },
  });
}

function renderArchive() {
  $("archive").innerHTML = archived
    ? `В архиве ${archived} · <span id="reset">вернуть все</span>`
    : "Слова, которые ты знаешь, уходят в архив";
  const reset = $("reset");
  if (reset) reset.onclick = resetArchive;
}

function paintButtons() {
  if (!revealed) {
    $("no").textContent = "Не знаю";
    $("yes").textContent = "Знаю";
    $("no").classList.remove("chosen");
    $("verdict").textContent = "";
    return;
  }
  // Green always moves on once the answer is up; red stays live so a wrong
  // "знаю" can be taken back, which is the only way the schedule stays honest.
  $("yes").textContent = "Дальше →";
  $("no").textContent = "Не знал";
  $("no").classList.toggle("chosen", verdict === false);
  $("verdict").textContent = verdict
    ? "✓ уйдёт в архив"
    : "↻ вернётся на повтор пораньше";
}

function show() {
  const card = queue[index];
  if (!card) return finish();

  revealed = false;
  verdict = null;
  $("word").textContent = card.word;
  $("pos").textContent = card.pos || "";
  $("answer").textContent = "";
  $("answer").classList.remove("show");
  $("shot").classList.remove("show");
  $("shot").removeAttribute("src");
  $("left").textContent = `${index + 1} / ${total}`;
  $("fill").style.width = `${(index / total) * 100}%`;
  paintButtons();

  // Pull the next card's picture into the browser cache while they are still
  // thinking about this one, so revealing it is instant rather than a wait.
  const next = queue[index + 1];
  if (next?.image) new Image().src = next.image;
}

function showPicture(url) {
  if (!url) return;
  const shot = $("shot");
  // Only shown once decoded: a box that appears empty and fills in later
  // shoves the word off the middle of the screen while they are reading it.
  const probe = new Image();
  probe.onload = () => {
    if (!revealed) return;          // they moved on; do not flash a stale photo
    shot.src = url;
    shot.classList.add("show");
  };
  probe.src = url;
}

function finish() {
  $("live").style.display = "none";
  $("buttons").style.display = "none";
  $("verdict").textContent = "";
  $("done").style.display = "block";
  $("fill").style.width = "100%";
  $("left").textContent = total ? `${total} / ${total}` : "";
  $("done-title").textContent = total ? "Готово 👌" : "Пока нечего повторять";
  $("done-text").textContent = total
    ? "Слова вернутся сами, когда ты начнёшь их забывать."
    : "Поговори немного или разбери ответ по словам — слова появятся здесь.";
  renderArchive();
}

function reveal(card, knew) {
  revealed = true;
  verdict = knew;
  $("answer").textContent = card.translation || "…";
  $("answer").classList.add("show");
  showPicture(card.image);
  paintButtons();
  buzz("light");

  // Most cards come from the assessor picking words out of a conversation,
  // which stores the word and nothing else — so the answer side is often
  // empty until someone asks for it.
  if (!card.translation || !card.image) fetchAnswer(card);
}

function commit() {
  const card = queue[index];
  if (!card) return;

  if (verdict) archived += 1;
  send(card.id, !!verdict);
  buzz(verdict ? "medium" : "rigid");

  index += 1;
  show();
  renderArchive();
}

$("no").onclick = () => {
  const card = queue[index];
  if (!card) return;
  if (!revealed) return reveal(card, false);
  // Correcting a premature "знаю". Stays on the card: they asked to see the
  // answer, and moving on the instant they admit the miss would take it away.
  verdict = false;
  paintButtons();
  buzz("light");
};

$("yes").onclick = () => {
  const card = queue[index];
  if (!card) return;
  if (!revealed) return reveal(card, true);
  commit();
};

/* The one call the learner waits on, because it is the thing they asked for.
   Everything it finds is written back to the shared catalogue, so a word costs
   this lookup once and is instant for every review after. */
async function fetchAnswer(card) {
  try {
    const response = await api("/api/review/reveal", {
      method: "POST", body: JSON.stringify({ card: card.id, initData }),
    });
    if (!response.ok) throw new Error(await response.text());
    const data = await response.json();

    card.translation = data.translation || card.translation;
    card.image = data.image || card.image;
    if (!revealed || queue[index] !== card) return;   // they pressed on

    $("answer").textContent = card.translation || "Перевода нет";
    showPicture(card.image);
  } catch (_) {
    if (revealed && queue[index] === card && !card.translation) {
      $("answer").textContent = "Перевода нет";
    }
  }
}

/* Fire-and-forget on purpose: the learner should never wait on the network
   between two cards. A dropped answer costs one card's schedule, and blocking
   the queue costs the session. */
function send(cardId, known) {
  api("/api/review/answer", {
    method: "POST",
    body: JSON.stringify({ card: cardId, known, initData }),
  }).catch(() => {});
}

async function resetArchive() {
  if (!archived) return;
  $("archive").textContent = "Возвращаю…";
  try {
    const response = await api("/api/review/reset", {
      method: "POST", body: JSON.stringify({ initData }),
    });
    if (!response.ok) throw new Error(await response.text());
    buzz("rigid");
    location.reload();
  } catch (_) {
    renderArchive();
  }
}

(async function start() {
  try {
    const response = await api("/api/review");
    if (!response.ok) throw new Error(await response.text());
    const data = await response.json();
    queue = data.cards || [];
    archived = data.archived || 0;
    total = queue.length;
    renderArchive();
    total ? show() : finish();
  } catch (error) {
    $("word").textContent = "Не открылось";
    $("pos").textContent = String(error.message || error).slice(0, 160);
    $("buttons").style.display = "none";
  }
})();
</script>
</body>
</html>
